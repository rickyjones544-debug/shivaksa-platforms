; ============================================================================
; Shivaksa customer platform dialplan (Phase 2).
; Isolated file — included once from /etc/asterisk/extensions.conf via:
;   #include extensions_customer_platform.conf
; Existing customer/provider contexts are untouched.
;
; Flow per customer INVITE:
;   1. AGI authorize -> platform validates account/wallet/concurrency/routing
;      and returns the carrier endpoint, dial string, and policy caller ID.
;   2. Customer From: header is NEVER used for billing or caller ID.
;   3. Hangup handler posts the authoritative final event (dialstatus,
;      hangupcause, billsec) -> CDR + wallet reservation reconciliation.
; ============================================================================

[from-shivaksa-customer-platform]
exten => _X.,1,Gosub(shv-customer-outbound,s,1(${CHANNEL(endpoint)},${EXTEN}))
 same => n,Hangup()
exten => _+X.,1,Gosub(shv-customer-outbound,s,1(${CHANNEL(endpoint)},${EXTEN}))
 same => n,Hangup()

[shv-customer-outbound]
exten => s,1,NoOp(customer-platform: endpoint=${ARG1} to=${ARG2})
 same => n,AGI(shv_customer_call.py,${ARG1},${ARG2},${CHANNEL(name)})
 same => n,GotoIf($["${SHV_AUTHORIZED}" = "1"]?dial:reject)

 same => n(reject),NoOp(customer-platform: rejected ${SHV_REASON})
 same => n,Hangup(${IF($[ ${SHV_CAUSE} ]?${SHV_CAUSE}:21)})

 ; SHV_* are set double-underscore so the outbound carrier channel inherits
 ; them and the U() answered-subroutine can see the call identifiers.
 same => n(dial),Set(__SHV_CALLID=${SHV_CALLID})
 same => n,Set(__SHV_ORGID=${SHV_ORGID})
 same => n,Set(CALLERID(num)=${SHV_CALLERID})
 same => n,Set(CHANNEL(hangup_handler_push)=shv-platform-hangup,s,1)
 same => n,System(/usr/local/bin/shv_report_event.py ringing "${SHV_CALLID}" "${SHV_ORGID}")
 same => n,Dial(PJSIP/${SHV_DIALSTRING}@${SHV_ENDPOINT},${SHV_MAXSEC},U(shv-platform-answered^s^1))
 same => n,Hangup()

; Runs on the outbound carrier channel the moment the call is answered.
[shv-platform-answered]
exten => s,1,System(/usr/local/bin/shv_report_event.py answered "${SHV_CALLID}" "${SHV_ORGID}")
 same => n,Return()

; Runs on the customer channel at hangup — the single authoritative final event.
[shv-platform-hangup]
exten => s,1,System(/usr/local/bin/shv_report_event.py final "${SHV_CALLID}" "${SHV_ORGID}" "${DIALSTATUS}" "${HANGUPCAUSE}" "${CDR(billsec)}")
 same => n,Return()

; Carrier inbound DID calls (e.g. Telnyx) gosub here from their inbound
; context. ARG1=DID (E.164), ARG2=caller ID, ARG3=provider call-id.
; AGI resolves the DID to a SIP account's Asterisk endpoint; we ring the
; registered contact. Same ringing/answered/final event reporting as outbound.
[shv-inbound-platform]
exten => s,1,NoOp(customer-platform-inbound: did=${ARG1} from=${ARG2})
 same => n,AGI(shv_inbound_call.py,${ARG1},${ARG2},${ARG3})
 same => n,GotoIf($["${SHV_INBOUND_OK}" = "1"]?ring:reject)

 same => n(reject),NoOp(customer-platform-inbound: rejected ${SHV_INBOUND_REASON})
 same => n,Hangup(21)

 same => n(ring),Set(__SHV_CALLID=${SHV_CALLID})
 same => n,Set(__SHV_ORGID=${SHV_ORGID})
 same => n,Set(CHANNEL(hangup_handler_push)=shv-platform-hangup,s,1)
 same => n,System(/usr/local/bin/shv_report_event.py ringing "${SHV_CALLID}" "${SHV_ORGID}")
 same => n,Dial(PJSIP/${SHV_INBOUND_ENDPOINT},30,U(shv-platform-answered^s^1))
 same => n,Hangup()
